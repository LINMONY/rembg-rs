[package]
name = "rembg-rs"
version = "0.1.0"
edition = "2021"
authors = ["Женя Швец"]
description = "Fast, standalone AI background remover in pure Rust with a native Windows GUI (inspired by rembg)"
license = "MIT"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
md-5 = "0.10"
tract-onnx = "0.21"
ureq = "2.10"
